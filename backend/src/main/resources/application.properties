spring.application.name=autodoor-backend
server.port=${PORT:8080}

# Database - uses environment variables on Render, falls back to MySQL locally
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autodoor_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:Admin123}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.autodoor=INFO
spring.jpa.open-in-view=false
