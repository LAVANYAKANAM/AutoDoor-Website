services:
  - type: web
    name: autodoor-backend
    runtime: java
    buildCommand: cd backend && mvn clean package -DskipTests
    startCommand: java -jar backend/target/autodoor-backend-1.0.0.jar
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false

  - type: web
    name: autodoor-frontend
    runtime: static
    staticPublishPath: frontend
